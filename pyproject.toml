[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dartrift"
version = "0.4.0"
description = "DART-RIFT: GPU hizlandirmali, belirlenimci SPH sok-fizigi motoru; Dimorphos ic yapisini DART carpma verisinden olasiliksal cikarir (FAZ 0-3 gecildi; FAZ 4 kapisi G4 gecildi, motor dogrulamasi surüyor)"
readme = "README.md"
# UST SINIR GERCEK: hedef ortam NumPy 1.26.4 saglıyor (ADR-0005) ve o
# surum Python 3.13'u desteklemiyor. Onceki ">=3.10" beyani test
# edilmeyen -- ve kurulamayan -- surumleri vaat ediyordu.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "DART-RIFT Team" }]
dependencies = [
    # Hedef ortam (TRUBA merkezi modulu) NumPy 1.26.4 saglar. Kod her iki ana
    # surumde de calisir; NumPy 2.0+ ile gelen API'ler kullanilamaz (ADR-0005).
    "numpy>=1.26",
    "h5py>=3.10",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = ["warp-lang>=1.0"]
# Bunlar ALT sinir. CI arac zinciri ayrica `constraints-ci.txt` ile
# UST sinira sabitlenir: ayni agac ruff 0.15 ile 191, 0.16 ile 183
# hata veriyordu ve lint sonucunun arac surumune gore degismesi bir
# kanit deposunda kabul edilemez.
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: CUDA GPU gerektirir (secmemek icin: -m \"not gpu\")",
    "warp: warp-lang paketi gerektirir (CPU cihazi yeterli)",
]

# KAPSAM YAPILANDIRMASI BURADA DEGIL: tek kaynak `.coveragerc`
# (ADR-0016). Burada da bir kopya vardi; coverage.py `.coveragerc`'yi
# once okudugu icin ETKISIZDI ama iki yapilandirma noktasi sapma
# uretir. `.coveragerc` ayrica `exclude_also` ile @wp.kernel/@wp.func
# govdelerini haric tutuyor -- buradaki kopyada o YOKTU, yani birinin
# gun gelip bunu etkin kilmasi esigi sessizce bozardi.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Warp kernel'lerinde sayac/indeks degiskenleri TIPLI tanimlanmalidir
# (`j = int(0)`); hash_grid_query_next'in `int&` parametresi Python
# literaliyle eslesmez ve derleme duser. UP018 bunu "gereksiz" sanip
# siliyordu — ADR-0010.
"src/dartrift/warp_core/*.py" = ["UP018"]
