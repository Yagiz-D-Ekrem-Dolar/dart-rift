# P0-QR-01: her commit'te derleme, statik analiz, birim testleri, config sema
# kontrolu; gecelik kosuda determinizm regresyonu tekrarlanir.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # gecelik determinizm regresyonu (UTC)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gpu]"

      - name: Statik analiz (ruff)
        run: ruff check src tests scripts

      - name: Config sema kontrolu (her fazin ornek config'i)
        run: |
          python -m dartrift.config configs/p0_smoke.yaml
          python -m dartrift.config configs/p1_sod.yaml
          python -m dartrift.config configs/p2_basalt.yaml

      # Kapsam yapilandirmasi `.coveragerc`'dedir ve coverage.py'nin VARSAYILAN
      # dosya adi oldugu icin bayrak gerektirmez (ADR-0016). @wp.kernel/@wp.func
      # govdeleri haric tutulur: coverage.py onlari olcemez, cunku Warp o
      # fonksiyonlari derler ve Python satir izleyicisi govdeyi hic gormez.
      # GPU cekirdekleri CPU<->GPU capraz kontrolleriyle dogrulanir.
      - name: Birim testleri + kapsam esigi (>= %85)
        run: >
          pytest tests -m "not gpu" --cov=dartrift
          --cov-fail-under=85 --cov-report=term-missing

      - name: Determinizm altin hash
        run: pytest tests/test_determinism_golden.py -q

      # GitHub runner'i GERCEKTEN GPU'suzdur; bu adim, kapi kosucusunun
      # kanitlanamayan C3 kriterini "GECTI" saymadigini gercek bir ortamda
      # dogrular (gelistirme makinesinde GPU oldugu icin orada sinanamiyor).
      - name: Kapi, GPU'suz ortamda GECTI iddia etmemeli
        run: |
          set +e
          python scripts/run_g0_gate.py --run-dir /tmp/g0_no_flag
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "HATA: GPU'suz kapi kosusu exit 2 dondurmeliydi, $rc dondu"; exit 1
          fi
          python scripts/run_g0_gate.py --allow-no-gpu --run-dir /tmp/g0_precheck
          grep -q "ON-KONTROL" /tmp/g0_precheck/G0_report.md
          grep -q "KANITLANAMADI" /tmp/g0_precheck/G0_report.md
          if grep -q "G0 GECTI" /tmp/g0_precheck/G0_report.md; then
            echo "HATA: GPU'suz rapor 'G0 GECTI' iddia ediyor"; exit 1
          fi

      # Ayni koruma G1 ve G2 icin de gecerli olmali. Bu adim olmadan, kapi
      # kosucularindan birinin GPU'suz ortamda "GECTI" demeye baslamasi
      # sessizce fark edilmezdi — oysa o koruma, kanitin tamaminin dayandigi
      # kuraldir ("test gecilmediyse iddia edilmez").
      - name: G1/G2 kapilari da GPU'suz ortamda GECTI iddia etmemeli
        run: |
          set +e
          python scripts/run_g1_gate.py --run-dir /tmp/g1_no_gpu; rc1=$?
          python scripts/run_g2_gate.py --run-dir /tmp/g2_no_gpu; rc2=$?
          set -e
          for g in "G1:$rc1" "G2:$rc2"; do
            name="${g%%:*}"; rc="${g##*:}"
            if [ "$rc" -ne 2 ]; then
              echo "HATA: $name GPU'suz kosuda exit 2 dondurmeliydi, $rc dondu"; exit 1
            fi
          done

      - name: Kirmizi takim kontrol listesi (§12)
        run: python scripts/run_red_team.py --run-dir /tmp/redteam
