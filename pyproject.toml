[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dartrift"
version = "0.3.0"
description = "DART-RIFT: GPU hizlandirmali SPH sok-fizigi motoru (FAZ 0-2: altyapi, sok cekirdegi, malzeme fizigi)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DART-RIFT Team" }]
dependencies = [
    # Hedef ortam (TRUBA merkezi modulu) NumPy 1.26.4 saglar. Kod her iki ana
    # surumde de calisir; NumPy 2.0+ ile gelen API'ler kullanilamaz (ADR-0005).
    "numpy>=1.26",
    "h5py>=3.10",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = ["warp-lang>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: CUDA GPU gerektirir (secmemek icin: -m \"not gpu\")",
    "warp: warp-lang paketi gerektirir (CPU cihazi yeterli)",
]

[tool.coverage.run]
source = ["dartrift"]

[tool.coverage.report]
precision = 1
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Warp kernel'lerinde sayac/indeks degiskenleri TIPLI tanimlanmalidir
# (`j = int(0)`); hash_grid_query_next'in `int&` parametresi Python
# literaliyle eslesmez ve derleme duser. UP018 bunu "gereksiz" sanip
# siliyordu — ADR-0010.
"src/dartrift/warp_core/*.py" = ["UP018"]
