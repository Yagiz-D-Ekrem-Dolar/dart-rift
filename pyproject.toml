[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dartrift"
version = "0.1.0"
description = "DART-RIFT FAZ 0: deterministik altyapi ve test iskeleti (SPH sok-fizigi motoru zemini)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DART-RIFT Team" }]
dependencies = [
    "numpy>=1.26",
    "h5py>=3.10",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = ["warp-lang>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: CUDA GPU gerektirir (secmemek icin: -m \"not gpu\")",
    "warp: warp-lang paketi gerektirir (CPU cihazi yeterli)",
]

[tool.coverage.run]
source = ["dartrift"]

[tool.coverage.report]
precision = 1
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
