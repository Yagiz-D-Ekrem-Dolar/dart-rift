# P0-QR-01: her commit'te derleme, statik analiz, birim testleri, config sema
# kontrolu; gecelik kosuda determinizm regresyonu tekrarlanir.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # gecelik determinizm regresyonu (UTC)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gpu]"

      - name: Statik analiz (ruff)
        run: ruff check src tests scripts

      - name: Config sema kontrolu
        run: python -m dartrift.config configs/p0_smoke.yaml

      - name: Birim testleri + kapsam esigi (>= %85)
        run: pytest tests -m "not gpu" --cov=dartrift --cov-fail-under=85 --cov-report=term-missing

      - name: Determinizm altin hash
        run: pytest tests/test_determinism_golden.py -q
